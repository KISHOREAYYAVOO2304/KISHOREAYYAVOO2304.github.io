<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kishore Kalash - Analyst & Designer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #0a0612;
            --accent-purple: #a955ff;
            --accent-cyan: #00f0ff; /* Added a cyber-cyan for contrast */
            --text-main: #ffffff;
            --text-muted: #8b8599;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Dynamic Background --- */
        .cyber-grid {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                linear-gradient(rgba(169, 85, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(169, 85, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            opacity: 0.5;
            animation: gridMove 20s linear infinite;
        }

        .glow-orb {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(169,85,255,0.15) 0%, rgba(10,6,18,0) 70%);
            border-radius: 50%;
            z-index: 0;
            animation: breathe 8s ease-in-out infinite alternate;
        }

        /* --- Main Content Wrapper --- */
        .intro-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: zoomOut 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* --- Name Animation Elements --- */
        .name-container {
            font-size: 5.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(169, 85, 255, 0.4);
        }

        .word {
            display: flex;
            align-items: flex-end;
            margin-right: 0.2em;
        }

        .initial {
            display: inline-block;
            color: var(--text-main);
        }

        .hidden-letters {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            max-width: 0;
            opacity: 0;
            animation: expandText 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 1.5s;
        }

        .subtitle {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease forwards;
            animation-delay: 2.8s;
        }

        /* --- Floating Tech Stack Icons --- */
        .tech-stack {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0; left: 0;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to background */
        }

        .tech-icon {
            position: absolute;
            font-size: 2.5rem;
            color: var(--text-muted);
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .tech-icon span {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.7;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Individual Icon Positions & Delays */
        .icon-1 { top: 20%; left: 15%; animation: popInFloat 4s ease-in-out infinite alternate 3.0s; } /* Figma */
        .icon-2 { top: 70%; left: 20%; animation: popInFloat 5s ease-in-out infinite alternate-reverse 3.2s; } /* Kali */
        .icon-3 { top: 15%; right: 20%; animation: popInFloat 4.5s ease-in-out infinite alternate 3.4s; } /* Nmap */
        .icon-4 { top: 65%; right: 15%; animation: popInFloat 5.5s ease-in-out infinite alternate-reverse 3.6s; } /* Photoshop */
        .icon-5 { top: 45%; left: 8%; animation: popInFloat 6s ease-in-out infinite alternate 3.8s; } /* Burp Suite */
        .icon-6 { top: 40%; right: 8%; animation: popInFloat 4.2s ease-in-out infinite alternate-reverse 4.0s; } /* Canva */
        .icon-7 { bottom: 10%; left: 45%; animation: popInFloat 5.2s ease-in-out infinite alternate 4.2s; } /* CorelDraw */
        .icon-8 { top: 10%; left: 45%; animation: popInFloat 4.8s ease-in-out infinite alternate-reverse 4.4s; } /* Nessus */

        .tech-icon:hover {
            color: var(--accent-purple);
            filter: drop-shadow(0 0 20px var(--accent-purple));
            transition: all 0.3s ease;
        }

        /* --- Keyframes --- */
        @keyframes zoomOut {
            0% { transform: scale(3.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes expandText {
            0% { max-width: 0; opacity: 0; }
            20% { opacity: 1; }
            100% { max-width: 400px; opacity: 1; }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes popInFloat {
            0% { opacity: 0; transform: scale(0) translateY(0); }
            10% { opacity: 0.4; transform: scale(1) translateY(0); color: var(--accent-cyan); }
            50% { opacity: 0.3; transform: scale(1) translateY(-15px); color: var(--text-muted); }
            100% { opacity: 0.3; transform: scale(1) translateY(10px); color: var(--text-muted); }
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        @keyframes breathe {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .name-container { font-size: 3rem; }
            .subtitle { font-size: 0.9rem; }
            .tech-icon { font-size: 1.8rem; }
            .icon-5, .icon-6, .icon-7, .icon-8 { display: none; }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="glow-orb"></div>

    <div class="tech-stack">
        <div class="tech-icon icon-1"><i class="devicon-figma-plain"></i><span>Figma</span></div>
        <div class="tech-icon icon-4"><i class="devicon-photoshop-plain"></i><span>Photoshop</span></div>
        <div class="tech-icon icon-6"><i class="devicon-canva-original"></i><span>Canva</span></div>
        <div class="tech-icon icon-7"><i class="fa-solid fa-pen-nib"></i><span>CorelDRAW</span></div>

        <div class="tech-icon icon-2"><i class="devicon-kalilinux-plain"></i><span>Kali Linux</span></div>
        <div class="tech-icon icon-3"><i class="fa-solid fa-network-wired"></i><span>Nmap</span></div>
        <div class="tech-icon icon-5"><i class="fa-solid fa-bug"></i><span>Burp Suite</span></div>
        <div class="tech-icon icon-8"><i class="fa-solid fa-shield-halved"></i><span>Nessus</span></div>
    </div>

    <div class="intro-wrapper">
        <div class="name-container">
            <div class="word">
                <span class="initial">K</span>
                <span class="hidden-letters">ishore</span>
            </div>
            <div class="word">
                <span class="initial">K</span>
                <span class="hidden-letters">alash</span>
            </div>
        </div>
        
        <p class="subtitle">Cyber Security Analyst & UI/UX Designer</p>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "home.html";
        }, 5000);
    </script>

</body>
</html>
